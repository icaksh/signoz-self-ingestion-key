services:
  proxy:
    build: .
    container_name: otlp-proxy
    env_file:
      - .env
    ports:
      - "${PROXY_PORT:-4318}:4318"
      # Admin port — bind to localhost only in production. Expose only for local dev:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
      - "${SYSLOG_PORT:-6514}:6514"
      - "${CA_RENEWAL_PORT:-6543}:6543"
    environment:
      - SIGNOZ_ENDPOINT=${SIGNOZ_ENDPOINT:-http://localhost:4318}
      - SIGNOZ_INGESTION_KEY=${SIGNOZ_INGESTION_KEY:-}
      - PROXY_PORT=4318
      - ADMIN_PORT=8080
      - DB_PATH=/data/tenants.db
      - USAGE_RETENTION_DAYS=${USAGE_RETENTION_DAYS:-90}
      # Syslog mTLS — optional; cert files must exist when SYSLOG_ENABLED=true
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - SYSLOG_LISTEN_ADDR=:6514
      - SYSLOG_SERVER_CERT_FILE=/certs/server.crt
      - SYSLOG_SERVER_KEY_FILE=/certs/server.key
      - SYSLOG_CLIENT_CA_FILE=/certs/client-ca.crt
      - SYSLOG_MAX_FRAME_BYTES=65536
      - SYSLOG_MAX_CONNECTIONS=1000
      - SYSLOG_CONN_IDLE_TIMEOUT=300s
      - SYSLOG_COLLECTOR_ADDR=127.0.0.1:5140
      # step-ca certificate lifecycle — optional
      - CA_ENABLED=${CA_ENABLED:-false}
      - CA_ENDPOINT=${CA_ENDPOINT:-https://step-ca:9000}
      - CA_PROVISIONER_NAME=${CA_PROVISIONER_NAME:-proxy}
      - CA_PROVISIONER_KEY_FILE=/certs/provisioner.jwk
      - CA_ROOT_CERT_FILE=/certs/root.crt
      - CA_CERT_LIFETIME=2160h
      - CA_RENEWAL_LISTEN_ADDR=:6543
      - CA_EXTERNAL_HOSTNAME=${CA_EXTERNAL_HOSTNAME:-}
      - CA_SYSLOG_RELAY_PORT=6514
    volumes:
      - proxy-data:/data
      - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  proxy-data:
