{{define "login"}}
{{template "auth" .}}
<div class="auth-card-wrap">
    <div class="auth-brand">
        <span class="brand-mark auth-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg>
        </span>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to the OTLP Proxy admin dashboard.</p>
    </div>
    <div class="auth-card">
        <form method="post" action="/login" class="auth-form">
            <div class="form-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-tinted btn-block">Sign in</button>
        </form>
    </div>
</div>
{{template "auth_end" .}}
{{end}}
