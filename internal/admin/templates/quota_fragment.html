{{define "quota_fragment"}}
{{if and .Quota (gt .Quota 0)}}
<div class="flex items-center justify-between mb-2">
    <span class="text-sm text-gray-400">Current 24h consumption</span>
    <span class="text-sm font-medium text-gray-300">{{megaBytes .Used}} MB / {{megaBytes .Quota}} MB ({{percent .Used .Quota}}%)</span>
</div>
<div class="h-2.5 w-full overflow-hidden rounded-full bg-gray-800">
    <div class="h-full rounded-full {{if ge (percent .Used .Quota) 90}}bg-red-500{{else if ge (percent .Used .Quota) 70}}bg-amber-500{{else}}bg-emerald-500{{end}}" style="width: {{percent .Used .Quota}}%"></div>
</div>
{{else}}
<p class="text-sm text-gray-500">N/A — no daily quota set</p>
{{end}}
{{end}}
