{{define "tenant_row"}}
{{if .APIKey}}
<tr class="bg-indigo-500/10">
    <td colspan="4" class="px-6 py-4">
        <div class="rounded-lg border border-indigo-500/40 bg-indigo-950/50 p-4">
            <p class="mb-2 text-sm font-semibold text-indigo-300">New API Key — copy it now, it will not be shown again</p>
            <div class="flex flex-wrap items-center gap-3">
                <code class="break-all rounded-md bg-gray-950 px-3 py-1.5 font-mono text-sm text-indigo-200">{{.APIKey}}</code>
                <button onclick="copyKey('{{.APIKey}}')"
                    class="rounded-md bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500 transition-colors">Copy</button>
            </div>
        </div>
    </td>
</tr>
{{end}}
<tr id="tenant-{{.ID}}" class="hover:bg-gray-800/50 transition-colors group">
    <td class="px-6 py-4 text-sm font-medium text-white">{{.Name}}</td>
    <td class="px-6 py-4 text-sm font-mono text-gray-400">{{.KeyPrefix}}&hellip;</td>
    <td class="px-6 py-4">
        {{if .Active}}
        <span class="inline-flex items-center rounded-full bg-emerald-500/10 px-2 py-0.5 text-xs font-medium text-emerald-400 ring-1 ring-inset ring-emerald-500/20">Active</span>
        {{else}}
        <span class="inline-flex items-center rounded-full bg-red-500/10 px-2 py-0.5 text-xs font-medium text-red-400 ring-1 ring-inset ring-red-500/20">Inactive</span>
        {{end}}
    </td>
    <td class="px-6 py-4">
        <div class="flex items-center gap-2">
            <a href="/tenants/{{.ID}}/usage" class="rounded-lg px-3 py-1.5 text-xs font-medium text-gray-300 hover:bg-gray-700 transition-colors">Usage</a>
            <button hx-get="/tenants/{{.ID}}/edit" hx-target="#form-area" hx-swap="innerHTML"
                class="rounded-lg px-3 py-1.5 text-xs font-medium text-gray-300 hover:bg-gray-700 transition-colors">Edit</button>
            <button hx-post="/tenants/{{.ID}}/regenerate" hx-target="#tenant-{{.ID}}" hx-swap="outerHTML" hx-confirm="Revoke old key and generate a new one?"
                class="rounded-lg px-3 py-1.5 text-xs font-medium text-amber-400 hover:bg-amber-500/10 transition-colors">Revoke Key</button>
            <button hx-delete="/tenants/{{.ID}}" hx-target="#tenant-{{.ID}}" hx-swap="outerHTML" hx-confirm="Delete this tenant permanently?"
                class="rounded-lg px-3 py-1.5 text-xs font-medium text-red-400 hover:bg-red-500/10 transition-colors">Delete</button>
        </div>
    </td>
</tr>
{{end}}
