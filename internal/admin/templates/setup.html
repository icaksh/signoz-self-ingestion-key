{{define "setup"}}
{{template "base" .}}
<div class="flex items-center justify-center" style="min-height:60vh">
    <div class="card w-full max-w-sm">
        <div class="card-header">
            <span class="font-semibold">Create Admin Account</span>
        </div>
        <div class="card-body">
            <p class="text-sm text-secondary mb-4">This is the first-time setup. Create the initial admin user.</p>
            <form hx-post="/setup" hx-target="this" hx-swap="outerHTML">
                <div class="mb-4">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required
                        minlength="12" placeholder="Min 12 characters">
                </div>
                <button type="submit" class="btn btn-primary w-full">Create Account</button>
            </form>
        </div>
    </div>
</div>
{{template "base_end" .}}
{{end}}
