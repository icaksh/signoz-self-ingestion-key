{{define "setup"}}
{{template "base"}}
<div class="mx-auto mt-20 max-w-sm">
    <h1 class="mb-2 text-center text-2xl font-bold text-white">Create Admin Account</h1>
    <p class="mb-6 text-center text-sm text-gray-400">First run — set up your admin user.</p>
    <form method="POST" action="/setup" class="space-y-4">
        <div>
            <label class="mb-1 block text-sm font-medium text-gray-300">Username</label>
            <input type="text" name="username" required autofocus
                class="w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium text-gray-300">Password</label>
            <input type="password" name="password" required
                class="w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <button type="submit"
            class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
            Create Account
        </button>
    </form>
</div>
{{template "base_end"}}
{{end}}
