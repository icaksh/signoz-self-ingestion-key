{{define "setup"}}
{{template "auth" .}}
<div class="auth-card-wrap">
    <div class="auth-brand">
        <span class="nav-brand-mark auth-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12h3l2-6 4 12 2-6h5"/>
            </svg>
        </span>
        <h1 class="auth-title">Set up your admin account</h1>
        <p class="auth-subtitle">This one-time step creates the first user who can manage the proxy.</p>
    </div>
    <div class="auth-card">
        <form method="post" action="/setup" class="auth-form">
            <div class="form-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                    minlength="12" placeholder="Min 12 characters">
                <p class="field-help">Use at least 12 characters. This protects the admin account.</p>
            </div>
            <button type="submit" class="btn btn-tinted btn-block">Create account</button>
        </form>
    </div>
</div>
{{template "auth_end" .}}
{{end}}
