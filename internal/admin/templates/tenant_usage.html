{{define "tenant_usage"}}
{{template "base" .}}
<div class="mb-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold">Usage: {{.Content.Tenant.Name}}</h1>
            <a href="/" class="text-sm text-secondary hover:text-accent transition-colors">&larr; Back to tenants</a>
        </div>
        <div class="flex gap-1">
            <button onclick="loadData('24h'); setActive(this)" class="btn btn-ghost btn-sm">24h</button>
            <button onclick="loadData('7d'); setActive(this)" class="btn btn-ghost btn-sm bg-input">7d</button>
            <button onclick="loadData('30d'); setActive(this)" class="btn btn-ghost btn-sm">30d</button>
        </div>
    </div>
</div>

<div class="mb-6" hx-get="/tenants/{{.Content.Tenant.ID}}/quota" hx-trigger="load" hx-swap="innerHTML">
    <div class="card p-4 text-sm text-secondary animate-pulse">Loading quota&hellip;</div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
    <div class="card">
        <div class="card-header">
            <span class="text-sm font-semibold">Requests Over Time</span>
        </div>
        <div class="card-body">
            <canvas id="requestsChart" class="h-[200px]"></canvas>
        </div>
    </div>
    <div class="card">
        <div class="card-header">
            <span class="text-sm font-semibold">Data Volume Over Time</span>
        </div>
        <div class="card-body">
            <canvas id="volumesChart" class="h-[200px]"></canvas>
        </div>
    </div>
</div>
<div class="card mb-6">
    <div class="card-header">
        <span class="text-sm font-semibold">Signal Type Breakdown</span>
    </div>
    <div class="card-body">
        <canvas id="signalsChart" class="h-[200px]"></canvas>
    </div>
</div>

<script src="/static/chart.umd.min.js"></script>
<script>
Chart.defaults.color = '#8b90a0';
Chart.defaults.borderColor = '#1f2340';

let requestsChart, volumesChart, signalsChart;
const tenantId = {{.Content.Tenant.ID}};

async function loadData(range) {
    const resp = await fetch('/tenants/' + tenantId + '/usage/data?range=' + range);
    const data = await resp.json();
    renderCharts(data);
}

function setActive(btn) {
    btn.parentElement.querySelectorAll('button').forEach(function(b) {
        b.classList.remove('bg-input');
    });
    btn.classList.add('bg-input');
}

function renderCharts(data) {
    if (requestsChart) requestsChart.destroy();
    if (volumesChart) volumesChart.destroy();
    if (signalsChart) signalsChart.destroy();

    requestsChart = new Chart(document.getElementById('requestsChart'), {
        type: 'bar',
        data: {
            labels: data.requests.map(function(r) { return r.label; }),
            datasets: [{ label: 'Requests', data: data.requests.map(function(r) { return r.count; }),
                backgroundColor: '#5470f0', borderRadius: 4 }]
        },
        options: {
            responsive: true,
            scales: { x: { grid: { display: false } }, y: { grid: { color: '#1f2340' } } }
        }
    });

    volumesChart = new Chart(document.getElementById('volumesChart'), {
        type: 'line',
        data: {
            labels: data.volumes.map(function(v) { return v.label; }),
            datasets: [{ label: 'Bytes', data: data.volumes.map(function(v) { return v.bytes; }),
                borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.1)',
                fill: true, tension: 0.3 }]
        },
        options: {
            responsive: true,
            scales: { x: { grid: { display: false } }, y: { grid: { color: '#1f2340' } } }
        }
    });

    signalsChart = new Chart(document.getElementById('signalsChart'), {
        type: 'doughnut',
        data: {
            labels: data.signal_types.map(function(s) { return s.type; }),
            datasets: [{ data: data.signal_types.map(function(s) { return s.count; }),
                backgroundColor: ['#5470f0','#34d399','#fbbf24','#f87171','#8b90a0','#06b6d4'],
                borderColor: '#141620' }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom', labels: { padding: 16 } } }
        }
    });
}

loadData('7d');
</script>
{{template "base_end" .}}
{{end}}
