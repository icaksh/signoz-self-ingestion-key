{{define "index"}}
{{template "base"}}
<div class="mb-6 flex items-center justify-between">
    <h1 class="text-xl font-bold text-white">Tenants</h1>
    <button hx-get="/tenants/new" hx-target="#form-area" hx-swap="innerHTML"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
        New Tenant
    </button>
</div>
<div id="form-area"></div>
<div class="rounded-xl border border-gray-800 bg-gray-900/50 overflow-hidden">
    <table class="w-full">
        <thead>
            <tr class="border-b border-gray-800 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                <th class="px-6 py-3">Name</th>
                <th class="px-6 py-3">API Key</th>
                <th class="px-6 py-3">Status</th>
                <th class="px-6 py-3">Actions</th>
            </tr>
        </thead>
        <tbody id="tenant-list" class="divide-y divide-gray-800">
            {{range .Tenants}}
                {{template "tenant_row" .}}
            {{end}}
        </tbody>
    </table>
</div>
{{template "base_end"}}
{{end}}
