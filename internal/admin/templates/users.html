{{define "users"}}
{{template "base"}}
<div class="mb-6">
    <h1 class="text-xl font-bold text-white">Users</h1>
</div>
<div class="mb-6 rounded-xl border border-gray-800 bg-gray-900/50 p-4">
    <form hx-post="/users" hx-target="#user-list" hx-swap="innerHTML" class="flex items-end gap-3">
        <div>
            <label class="mb-1 block text-sm font-medium text-gray-300">Username</label>
            <input type="text" name="username" placeholder="Username" required
                class="rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium text-gray-300">Password</label>
            <input type="password" name="password" placeholder="Password" required
                class="rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <button type="submit"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">Add User</button>
    </form>
</div>
<div id="user-list">
    {{template "user_list" .}}
</div>
{{template "base_end"}}
{{end}}

{{define "user_list"}}
<div class="rounded-xl border border-gray-800 bg-gray-900/50 overflow-hidden">
    <table class="w-full">
        <thead>
            <tr class="border-b border-gray-800 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                <th class="px-6 py-3">Username</th>
                <th class="px-6 py-3">Created</th>
                <th class="px-6 py-3"></th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
            {{range .Users}}
            <tr class="hover:bg-gray-800/50 transition-colors">
                <td class="px-6 py-4 text-sm font-medium text-white">{{.Username}}</td>
                <td class="px-6 py-4 text-sm text-gray-400">{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                <td class="px-6 py-4">
                    <button hx-delete="/users/{{.ID}}" hx-target="#user-list" hx-swap="innerHTML"
                        class="rounded-lg px-3 py-1.5 text-xs font-medium text-red-400 hover:bg-red-500/10 transition-colors">Delete</button>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
