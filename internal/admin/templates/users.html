{{define "users"}}
{{template "base" .}}
<div class="mb-6 flex items-center justify-between">
    <h1 class="text-xl font-bold">Admin Users</h1>
    <button onclick="document.getElementById('new-user-form').classList.toggle('hidden')"
        class="btn btn-primary btn-sm">Add User</button>
</div>

<div id="new-user-form" class="card mb-6 hidden">
    <div class="card-header">
        <span class="font-semibold">New User</span>
        <button onclick="this.closest('.card').classList.add('hidden')"
            class="text-sm text-secondary hover:text-danger transition-colors">&times;</button>
    </div>
    <div class="card-body">
        <form hx-post="/users" hx-target="#user-list" hx-swap="innerHTML">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required
                        minlength="12" placeholder="Min 12 characters">
                </div>
            </div>
            <div class="flex justify-end">
                <button type="submit" class="btn btn-primary btn-sm">Create User</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Created</th>
                <th class="text-right">Actions</th>
            </tr>
        </thead>
        <tbody id="user-list">
            {{template "user_list" .Content}}
        </tbody>
    </table>
</div>
{{template "base_end" .}}
{{end}}

{{define "user_list"}}
{{if .Users}}
{{range .Users}}
<tr id="user-{{.ID}}">
    <td>
        <div class="font-medium">{{.Username}}</div>
    </td>
    <td>
        <span class="text-xs text-secondary">{{formatTime .CreatedAt}}</span>
    </td>
    <td>
        <div class="flex justify-end">
            <button hx-delete="/users/{{.ID}}" hx-target="#user-{{.ID}}" hx-swap="outerHTML"
                hx-confirm="true" data-confirm-name="user {{.Username}}"
                class="btn btn-ghost btn-sm" style="color:var(--danger)">Delete</button>
        </div>
    </td>
</tr>
{{end}}
{{else}}
<tr>
    <td colspan="3">
        <div class="empty-state">
            <div class="empty-state-title">No users found</div>
        </div>
    </td>
</tr>
{{end}}
{{end}}
